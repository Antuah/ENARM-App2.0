# PostgreSQL para desarrollo: docker compose up -d db
# App completa en producción: ver docs/BACKEND.md antes de habilitar app.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entrenarme
      POSTGRES_USER: entrenarme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrenarme -d entrenarme"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    profiles: [web]
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN}
      DATABASE_URL: postgresql://entrenarme:${POSTGRES_PASSWORD}@db:5432/entrenarme
      DATABASE_SSL: "false"
      SEED_SAMPLE_BANK: "false"
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Entrenarme <no-reply@example.com>}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
